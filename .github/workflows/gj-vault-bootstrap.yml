name: GJ Vault Permanent Bootstrap

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rerun of the current Drive control record"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/workflows/gj-vault-bootstrap.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: gj-vault-permanent-control
  cancel-in-progress: false

env:
  CATALOG_AND_STATUS_FOLDER_ID: "1jfNOJI-BB8jllEedJqpWPBFNPJalzUX9"
  K8_A_DISCOVERY_FOLDER_ID: "1eUdwGZTKY-5vFVXd3CDcX0rOYr9MVw0H"
  BOOTSTRAP_SHA256: "5a1c397c20277d566d2db409d239a458329880d8ac65368243944a088ba7cb95"
  SEED_CONTROLLER_SHA256: "08167272a5720ea11a00ec6ca21b813eb019b518e15cb5776334f08d31256d1a"
  SEED_CONFIG_SHA256: "276ee31462389e647ebda4933f40199ddb4dde92f3b45e654de0912da27cc5b8"
  USER_PC_BYTES_USED: "0"
  TRAINING_PERFORMED: "NO"
  MODEL_WEIGHTS_MODIFIED: "NO"

jobs:
  control:
    name: Drive-controlled vault stage runner
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Drive client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            google-api-python-client==2.179.0 \
            google-auth==2.40.3 \
            google-auth-httplib2==0.2.0

      - name: Materialize frozen permanent bootstrap and K8-A seed
        shell: bash
        env:
          BOOTSTRAP_B64: ""
          SEED_CONTROLLER_B64: ""
          SEED_CONFIG_B64: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gj-vault-bootstrap"
          printf '%s' "$BOOTSTRAP_B64" | base64 -d > "$RUNNER_TEMP/gj-vault-bootstrap/gj_vault_bootstrap.py"
          printf '%s' "$SEED_CONTROLLER_B64" | base64 -d > "$RUNNER_TEMP/gj-vault-bootstrap/k8_discovery_v2.py"
          printf '%s' "$SEED_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/gj-vault-bootstrap/K8_A_DISCOVERY_CONFIG_V1.json"
          test "$(sha256sum "$RUNNER_TEMP/gj-vault-bootstrap/gj_vault_bootstrap.py" | awk '{print $1}')" = "$BOOTSTRAP_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/gj-vault-bootstrap/k8_discovery_v2.py" | awk '{print $1}')" = "$SEED_CONTROLLER_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/gj-vault-bootstrap/K8_A_DISCOVERY_CONFIG_V1.json" | awk '{print $1}')" = "$SEED_CONFIG_SHA256"
          python -m py_compile "$RUNNER_TEMP/gj-vault-bootstrap/gj_vault_bootstrap.py" "$RUNNER_TEMP/gj-vault-bootstrap/k8_discovery_v2.py"
          python - <<'PYJSON'
          import json, os
          from pathlib import Path
          json.loads((Path(os.environ['RUNNER_TEMP'])/'gj-vault-bootstrap'/'K8_A_DISCOVERY_CONFIG_V1.json').read_text())
          print('FROZEN_MATERIALIZATION_GATE=PASS')
          PYJSON

      - name: Bootstrap self-test
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/gj-vault-bootstrap/gj_vault_bootstrap.py" --self-test
          python "$RUNNER_TEMP/gj-vault-bootstrap/k8_discovery_v2.py" \
            --config "$RUNNER_TEMP/gj-vault-bootstrap/K8_A_DISCOVERY_CONFIG_V1.json" \
            --self-test

      - name: Execute current Drive control record
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          SEED_CONTROLLER_B64: ""
          SEED_CONFIG_B64: ""
        run: |
          set -euo pipefail
          force=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            force="--force"
          fi
          python "$RUNNER_TEMP/gj-vault-bootstrap/gj_vault_bootstrap.py" $force
