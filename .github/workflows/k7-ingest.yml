                  }
                  if not all(manifest["identity_verification"].values()):
                      fail("IDENTITY_VERIFICATION=FAIL")
          
                  manifest_path = out_dir / "manifest.json"
                  manifest_bytes, manifest_sha = write_json(manifest_path, manifest)
                  checksums_path = out_dir / "checksums.sha256"
                  checksums_path.write_text(
                      f"{canonical_sha}  {package.name}\n{manifest_sha}  manifest.json\n",
