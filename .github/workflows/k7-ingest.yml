                      "root_tree": root_tree,
                      "identity_verification": {
                          "full_sha_length_40": len(frozen) == 40,
                          "fetched_commit_equals_frozen_commit": fetched == frozen,
                          "resolved_commit_equals_frozen_commit": resolved == frozen,
                          "root_tree_literal_nonempty": bool(SHA40.fullmatch(root_tree)),
                          "gitlinks_verified": all(c["commit_match"] for c in scan.components),
                      },
                      "acquisition_method": "single ls-remote --symref HEAD observation; freeze exact SHA; fetch exact SHA; recursive exact gitlink materialization",
                      "submodule_url_policy": {"allowed": "https://github.com or relative GitHub URL", "declared_count": len(submodule_urls)},
                      "package_filename": package.name,
                      "package_format": "tar",
                      "package_construction": "deterministic Python GNU TAR from recursively verified tracked leaf paths; export-ignore not honored; .git metadata excluded",
                      "physical_bytes": physical_bytes,
