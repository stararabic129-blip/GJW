          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'gj-k7-control','sources.json')
          cfg=json.load(open(p, encoding='utf-8'))
          assert cfg['schema']=='GJ_K7_INGEST_SOURCES_V1'
          assert cfg['drive_code_parent_id']=='1sVIAQ3-F4UILCXpqCJXMvLW45zWc64Ph'
          print('EMBEDDED_ENGINE_MATERIALIZATION=PASS')
          PY

      - name: Validate ingestion configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/gj-k7-control/k7_ingest.py" \
            --config "$RUNNER_TEMP/gj-k7-control/sources.json" \
            --batch "$K7_BATCH" \
            --validate-only

      - name: Guard Drive credentials
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GDRIVE_CLIENT_ID" || -z "$GDRIVE_CLIENT_SECRET" || -z "$GDRIVE_REFRESH_TOKEN" ]]; then
            echo "DRIVE_AUTH_BLOCKER=Missing GDRIVE_CLIENT_ID/GDRIVE_CLIENT_SECRET/GDRIVE_REFRESH_TOKEN"
            exit 1
          fi
          echo "DRIVE_AUTH_SECRET_PRESENCE=PASS"

      - name: Install pinned Drive client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            google-api-python-client==2.179.0 \
            google-auth==2.40.3 \
            google-auth-httplib2==0.2.0

      - name: Run generic fail-closed ingestion sequentially
        id: ingest
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/gj-k7-control/k7_ingest.py" \
            --config "$RUNNER_TEMP/gj-k7-control/sources.json" \
            --batch "$K7_BATCH"

      - name: Preserve cloud-worker outputs for 7 days
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GJ-K7-${{ env.K7_BATCH }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gj-k7-artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Final non-training guard
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "GENERIC_INGESTION_ENGINE=PASS"
          echo "BATCH=$K7_BATCH"
          echo "USER_PC_BYTES_USED=0"
          echo "TRAINING_PERFORMED=NO"
          echo "MODEL_WEIGHTS_MODIFIED=NO"
          echo "NEXT_BATCH_STARTED=NO"
